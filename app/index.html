<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art, in your browser</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <header class="brand">
      <h1>Vice Cover Studio</h1>
      <p>Turn any photo into a neon, multi-panel GTA-style cover. Everything runs on this
         page — your photo never leaves your machine.</p>
    </header>

    <div id="drop" class="drop" tabindex="0" role="button"
         aria-label="Drop a photo here, or click to choose one">
      <span class="drop-title">Drop a photo here</span>
      <span class="drop-sub">or click to choose a file</span>
      <input id="photo" type="file" accept="image/*" hidden>
    </div>

    <div class="samples" role="group" aria-label="Sample scenes">
      <span class="samples-label">No photo handy? Try a scene:</span>
      <div class="samples-row">
        <button type="button" class="sample" data-sample="pier">Pier</button>
        <button type="button" class="sample" data-sample="boulevard">Boulevard</button>
        <button type="button" class="sample" data-sample="marina">Marina</button>
      </div>
    </div>

    <label>Title
      <input id="title" type="text" maxlength="24" value="Vice City" autocomplete="off">
    </label>
    <label>Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist" autocomplete="off">
    </label>

    <div class="row">
      <label>Layout
        <select id="layout">
          <option value="classic" selected>Classic panels</option>
          <option value="hero">Full-bleed hero</option>
          <option value="stack">Triple stack</option>
        </select>
      </label>
      <label>Grade
        <select id="grade">
          <option value="sunset" selected>Sunset neon</option>
          <option value="midnight">Midnight</option>
          <option value="golden">Golden hour</option>
        </select>
      </label>
    </div>

    <label>Export size
      <select id="size">
        <option value="square" selected>Square · 1080 × 1080</option>
        <option value="wide">Wide · 1280 × 720</option>
        <option value="portrait">Portrait · 1080 × 1350</option>
      </select>
    </label>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status">Loading the pier scene…</p>
  </section>

  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
